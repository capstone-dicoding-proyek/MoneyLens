name: CI - MoneyLens

on:
  push:
    branches: [main, master, refactor, dev]
  pull_request:
    branches: [main, master, refactor, dev]

jobs:
  backend-ci:
    name: Backend CI (Lint & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs/be

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fs/be/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Integration Tests
        run: npm test

  frontend-ci:
    name: Frontend CI (Lint, Build & Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs/fe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fs/fe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm test

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: fs/fe/playwright-report/
          retention-days: 7
